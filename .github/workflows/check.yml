name: Check

on:
  pull_request:
  push:
    branches: [main]
  # Daily, so an API change that breaks an example is caught even when the docs didn't change.
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check 2>&1 | tee check.log
        shell: bash
      - name: Open an issue when the daily check fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Docs check failing against the live API"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            printf 'The daily check failed (%s):\n\n```\n%s\n```\n' "$RUN_URL" "$(tail -40 check.log)" > body.md
            gh issue create --title "$title" --body-file body.md
          fi
